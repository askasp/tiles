  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ckground:#ecebe7;color:#1c1b19;font-family:'Geist',system-ui,sans-serif\">\n<div style=\"display:flex;flex-direction:column;gap:10px;max-width:1300px\">\n<span style=\"font-family:'Geist Mono',monospace;font-size:14px;color:#77736b\">ChatOS · Tile · v4 · From a clean install<\u002Fspan>\n<span style=\"font-size:46px;font-weight:600;letter-spacing:-.01em\">Sources, resources, actions<\u002Fspan>\n<span style=\"font-size:20px;line-height:1.5;color:#55524c;text-wrap:pretty\">OpenCode is one source among many, not what “project” means. Super+K searches everything; each result shows where it comes from and what ↵ will do before anything opens.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;max-width:1748px\">\n<div style=\"display:flex;flex-direction:column;gap:8px;padding:22px 24px;border-radius:14px;background:#ffffff;border:1px solid #dedcd7\"><span style=\"font-size:22px;font-weight:600\">Source<\u002Fspan><span style=\"font-family:'Geist Mono',monospace;font-size:13.5px;color:#1478b0\">Browser · Files · Terminal · OpenCode · Front · Gmail…<\u002Fspan><span style=\"font-size:15px;line-height:1.5;color:#55524c;text-wrap:pretty\">Where things come from. Three are built in, and one model powers K. The rest are added by asking K, which builds a connector from the service’s API.<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px;padding:22px 24px;border-radius:14px;background:#ffffff;border:1px solid #dedcd7\"><span style=\"font-size:22px;font-weight:600\">Resource<\u002Fspan><span style=\"font-family:'Geist Mono',monospace;font-size:13.5px;color:#1478b0\">folder · page · project · session · conversation…<\u002Fspan><span style=\"font-size:15px;line-height:1.5;color:#55524c;text-wrap:pretty\">A thing inside a source. Each one opens as a tile with the same header, showing the source and resource type.<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px;padding:22px 24px;border-radius:14px;background:#ffffff;border:1px solid #dedcd7\"><span style=\"font-size:22px;font-weight:600\">Action<\u002Fspan><span style=\"font-family:'Geist Mono',monospace;font-size:13.5px;color:#1478b0\">Browse files · Show sessions · Start session · Reply…<\u002Fspan><span style=\"font-size:15px;line-height:1.5;color:#55524c;text-wrap:pretty\">What ↵ does. Always written on the result. → lists the other actions for the same resource.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px\">\n<div style=\"display:flex;flex-direction:column;gap:8px;padding:20px 22px;border-radius:14px;background:#ffffff;border:1px solid #dedcd7\"><span style=\"font-family:'Geist Mono',monospace;font-size:13px;color:#77736b\">1<\u002Fspan><span style=\"font-size:18px;font-weight:600\">Search everything by default<\u002Fspan><span style=\"font-size:15px;line-height:1.5;color:#55524c;text-wrap:pretty\">One query searches every connected source. Recent choices rank higher.<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px;padding:20px 22px;border-radius:14px;background:#ffffff;border:1px solid #dedcd7\"><span style=\"font-family:'Geist Mono',monospace;font-size:13px;color:#77736b\">2<\u002Fspan><span style=\"font-size:18px;font-weight:600\">Narrow when you want<\u002Fspan><span style=\"font-size:15px;line-height:1.5;color:#55524c;text-wrap:pretty\">Tab scopes K to one source, like OpenCode or Files. It narrows the search, it doesn’t wrap your tiles.<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px;padding:20px 22px;border-radius:14px;background:#ffffff;border:1px solid #dedcd7\"><span style=\"font-family:'Geist Mono',monospace;font-size:13px;color:#77736b\">3<\u002Fspan><span style=\"font-size:18px;font-weight:600\">Same name, different things<\u002Fspan><span style=\"font-size:15px;line-height:1.5;color:#55524c;text-wrap:pretty\">“chatos” can be a folder, an OpenCode project and a GitHub repo. They are listed side by side, never merged.<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px;padding:20px 22px;border-radius:14px;background:#ffffff;border:1px solid #dedcd7\"><span style=\"font-family:'Geist Mono',monospace;font-size:13px;color:#77736b\">4<\u002Fspan><span style=\"font-size:18px;font-weight:600\">Nothing is created silently<\u002Fspan><span style=\"font-size:15px;line-height:1.5;color:#55524c;text-wrap:pretty\">Searching for a project never starts a session. Starting one is its own action, confirmed with ↵.<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px;padding:20px 22px;border-radius:14px;background:#ffffff;border:1px solid #dedcd7\"><span style=\"font-family:'Geist Mono',monospace;font-size:13px;color:#77736b\">5<\u002Fspan><span style=\"font-size:18px;font-weight:600\">Ambiguous? Offer choices<\u002Fspan><span style=\"font-size:15px;line-height:1.5;color:#55524c;text-wrap:pretty\">K interprets sentences, but when the destination isn’t clear it lists options instead of guessing.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<section id=\"A\" data-screen-label=\"A Clean slate\" style=\"width:2912px;box-sizing:border-box;padding:80px 80px 0;display:flex;flex-direction:column;gap:24px;background:#ecebe7;color:#1c1b19;font-family:'Geist',system-ui,sans-serif\">\n<div style=\"display:flex;align-items:center;gap:16px\"><span style=\"width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:#1793d1;color:#ffffff;font-size:18px;font-weight:600\">A<\u002Fspan><div style=\"display:flex;flex-direction:column\"><span style=\"font-size:26px;font-weight:600\">A clean install<\u002Fspan><span style=\"font-size:16px;color:#55524c\">First a model for K, then the built-in Browser, Files and Terminal. All follow the tile rules.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;align-items:flex-start;gap:20px\">\n<div id=\"A0\" style=\"width:864px;flex:none;display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:flex;align-items:center;gap:10px\"><span style=\"height:24px;display:flex;align-items:center;padding:0 8px;border-radius:7px;background:#1c1b19;color:#ffffff;font:600 12px/1 'Geist Mono',monospace\">A0<\u002Fspan><span style=\"font-size:19px;font-weight:600\">Connect a model<\u002Fspan><span style=\"margin-left:auto;height:28px;display:flex;align-items:center;padding:0 11px;border-radius:8px;background:#ffffff;border:1px solid #dad8d3;font:500 13px/1 'Geist Mono',monospace;color:#4a4742;white-space:nowrap\">first launch<\u002Fspan><\u002Fdiv>\n<div style=\"width:864px;height:540px;border-radius:12px;overflow:hidden;border:1px solid #d6d4cf;box-shadow:0 22px 50px -28px rgba(0,0,0,.35);pointer-events:none\"><div style=\"width:1440px;height:900px;transform:scale(.6);transform-origin:0 0\"><dc-import name=\"ChatOS Screen v4\" step=\"a0\" framed=\"true\" hint-size=\"1440px,900px\" style=\"width:1440px;height:900px;display:block\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n<span style=\"font-size:15.5px;line-height:1.5;color:#55524c;text-wrap:pretty\">K needs a model before it can understand anything, so this is the only thing first launch asks for. Base URL and key for any OpenAI-compatible endpoint, or a local model. The same model later builds connectors and maps tiles.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"width:40px;flex:none;padding-top:300px;display:flex;justify-content:center;color:#a29e96\"><svg width=\"30\" height=\"14\" sc-camel-view-box=\"0 0 30 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M1 7h27M22 1l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<div id=\"A1\" style=\"width:864px;flex:none;display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:flex;align-items:center;gap:10px\"><span style=\"height:24px;display:flex;align-items:center;padding:0 8px;border-radius:7px;background:#1c1b19;color:#ffffff;font:600 12px/1 'Geist Mono',monospace\">A1<\u002Fspan><span style=\"font-size:19px;font-weight:600\">Open a website<\u002Fspan><span style=\"margin-left:auto;height:28px;display:flex;align-items:center;padding:0 11px;border-radius:8px;background:#ffffff;border:1px solid #dad8d3;font:500 13px/1 'Geist Mono',monospace;color:#4a4742;white-space:nowrap\">Super+K opencode.ai<\u002Fspan><\u002Fdiv>\n<div style=\"width:864px;height:540px;border-radius:12px;overflow:hidden;border:1px solid #d6d4cf;box-shadow:0 22px 50px -28px rgba(0,0,0,.35);pointer-events:none\"><div style=\"width:1440px;height:900px;transform:scale(.6);transform-origin:0 0\"><dc-import name=\"ChatOS Screen v4\" step=\"a1\" framed=\"true\" hint-size=\"1440px,900px\" style=\"width:1440px;height:900px;display:block\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n<span style=\"font-size:15.5px;line-height:1.5;color:#55524c;text-wrap:pretty\">With a model connected, K is ready. Typing a URL offers Open in Browser; every result shows its source and action.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"width:40px;flex:none;padding-top:300px;display:flex;justify-content:center;color:#a29e96\"><svg width=\"30\" height=\"14\" sc-camel-view-box=\"0 0 30 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M1 7h27M22 1l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<div id=\"A2\" style=\"width:864px;flex:none;display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:flex;align-items:center;gap:10px\"><span style=\"height:24px;display:flex;align-items:center;padding:0 8px;border-radius:7px;background:#1c1b19;color:#ffffff;font:600 12px/1 'Geist Mono',monospace\">A2<\u002Fspan><span style=\"font-size:19px;font-weight:600\">A Browser tile<\u002Fspan><span style=\"margin-left:auto;height:28px;display:flex;align-items:center;padding:0 11px;border-radius:8px;background:#ffffff;border:1px solid #dad8d3;font:500 13px/1 'Geist Mono',monospace;color:#4a4742;white-space:nowrap\">↵<\u002Fspan><\u002Fdiv>\n<div style=\"width:864px;height:540px;border-radius:12px;overflow:hidden;border:1px solid #d6d4cf;box-shadow:0 22px 50px -28px rgba(0,0,0,.35);pointer-events:none\"><div style=\"width:1440px;height:900px;transform:scale(.6);transform-origin:0 0\"><dc-import name=\"ChatOS Screen v4\" step=\"a2\" framed=\"true\" hint-size=\"1440px,900px\" style=\"width:1440px;height:900px;display:block\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n<span style=\"font-size:15.5px;line-height:1.5;color:#55524c;text-wrap:pretty\">The page fills the workspace. ⌃. on a page sends it to a session later, once one exists.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:flex-start;gap:20px\">\n<div id=\"A3\" style=\"width:864px;flex:none;display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:flex;align-items:center;gap:10px\"><span style=\"height:24px;display:flex;align-items:center;padding:0 8px;border-radius:7px;background:#1c1b19;color:#ffffff;font:600 12px/1 'Geist Mono',monospace\">A3<\u002Fspan><span style=\"font-size:19px;font-weight:600\">Search: chatos<\u002Fspan><span style=\"margin-left:auto;height:28px;display:flex;align-items:center;padding:0 11px;border-radius:8px;background:#ffffff;border:1px solid #dad8d3;font:500 13px/1 'Geist Mono',monospace;color:#4a4742;white-space:nowrap\">Super+K chatos<\u002Fspan><\u002Fdiv>\n<div style=\"width:864px;height:540px;border-radius:12px;overflow:hidden;border:1px solid #d6d4cf;box-shadow:0 22px 50px -28px rgba(0,0,0,.35);pointer-events:none\"><div style=\"width:1440px;height:900px;transform:scale(.6);transform-origin:0 0\"><dc-import name=\"ChatOS Screen v4\" step=\"a3\" framed=\"true\" hint-size=\"1440px,900px\" style=\"width:1440px;height:900px;display:block\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n<span style=\"font-size:15.5px;line-height:1.5;color:#55524c;text-wrap:pretty\">Before any service is connected, “chatos” finds the folder. Browse files is the main action, Open terminal here is one → away.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"width:40px;flex:none;padding-top:300px;display:flex;justify-content:center;color:#a29e96\"><svg width=\"30\" height=\"14\" sc-camel-view-box=\"0 0 30 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M1 7h27M22 1l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<div id=\"A4\" style=\"width:864px;flex:none;display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:flex;align-items:center;gap:10px\"><span style=\"height:24px;display:flex;align-items:center;padding:0 8px;border-radius:7px;background:#1c1b19;color:#ffffff;font:600 12px/1 'Geist Mono',monospace\">A4<\u002Fspan><span style=\"font-size:19px;font-weight:600\">A Files tile<\u002Fspan><span style=\"margin-left:auto;height:28px;display:flex;align-items:center;padding:0 11px;border-radius:8px;background:#ffffff;border:1px solid #dad8d3;font:500 13px/1 'Geist Mono',monospace;color:#4a4742;white-space:nowrap\">↵<\u002Fspan><\u002Fdiv>\n<div style=\"width:864px;height:540px;border-radius:12px;overflow:hidden;border:1px solid #d6d4cf;box-shadow:0 22px 50px -28px rgba(0,0,0,.35);pointer-events:none\"><div style=\"width:1440px;height:900px;transform:scale(.6);transform-origin:0 0\"><dc-import name=\"ChatOS Screen v4\" step=\"a4\" framed=\"true\" hint-size=\"1440px,900px\" style=\"width:1440px;height:900px;display:block\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n<span style=\"font-size:15.5px;line-height:1.5;color:#55524c;text-wrap:pretty\">The workspace takes the folder’s name. Browser and Files split the screen.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"width:40px;flex:none;padding-top:300px;display:flex;justify-content:center;color:#a29e96\"><svg width=\"30\" height=\"14\" sc-camel-view-box=\"0 0 30 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M1 7h27M22 1l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<div id=\"A5\" style=\"width:864px;flex:none;display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:flex;align-items:center;gap:10px\"><span style=\"height:24px;display:flex;align-items:center;padding:0 8px;border-radius:7px;background:#1c1b19;color:#ffffff;font:600 12px/1 'Geist Mono',monospace\">A5<\u002Fspan><span style=\"font-size:19px;font-weight:600\">A Terminal tile<\u002Fspan><span style=\"margin-left:auto;height:28px;display:flex;align-items:center;padding:0 11px;border-radius:8px;background:#ffffff;border:1px solid #dad8d3;font:500 13px/1 'Geist Mono',monospace;color:#4a4742;white-space:nowrap\">Super+K terminal<\u002Fspan><\u002Fdiv>\n<div style=\"width:864px;height:540px;border-radius:12px;overflow:hidden;border:1px solid #d6d4cf;box-shadow:0 22px 50px -28px rgba(0,0,0,.35);pointer-events:none\"><div style=\"width:1440px;height:900px;transform:scale(.6);transform-origin:0 0\"><dc-import name=\"ChatOS Screen v4\" step=\"a5\" framed=\"true\" hint-size=\"1440px,900px\" style=\"width:1440px;height:900px;display:block\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n<span style=\"font-size:15.5px;line-height:1.5;color:#55524c;text-wrap:pretty\">A terminal opens in the folder of the focused tile. Three tiles: one large, two stacked.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:flex-start;gap:20px\">\n<div style=\"width:864px;flex:none;box-sizing:border-box;display:flex;flex-direction:column;gap:4px;padding:26px 28px;border-radius:14px;background:#ffffff;border:1px solid #dedcd7\">\n<span style=\"font-size:20px;font-weight:600\">Built in<\u002Fspan>\n<span style=\"font-size:15px;line-height:1.5;color:#55524c;margin-bottom:12px;text-wrap:pretty\">These three need deep, live interaction, so they ship with ChatOS instead of being generated.<\u002Fspan>\n<div style=\"display:flex;align-items:flex-start;gap:16px;padding:12px 0;border-top:1px solid #f0efec\"><span style=\"width:180px;flex:none;font-size:15px;font-weight:500\">Browser<\u002Fspan><span style=\"flex:1;font-size:15px;line-height:1.5;color:#55524c;text-wrap:pretty\">Pages, previews from sessions, OAuth sign-in pages<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:flex-start;gap:16px;padding:12px 0;border-top:1px solid #f0efec\"><span style=\"width:180px;flex:none;font-size:15px;font-weight:500\">Files<\u002Fspan><span style=\"flex:1;font-size:15px;line-height:1.5;color:#55524c;text-wrap:pretty\">Folders and files on this machine. Opening a file picks the right viewer.<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:flex-start;gap:16px;padding:12px 0;border-top:1px solid #f0efec\"><span style=\"width:180px;flex:none;font-size:15px;font-weight:500\">Terminal<\u002Fspan><span style=\"flex:1;font-size:15px;line-height:1.5;color:#55524c;text-wrap:pretty\">A shell in any folder. Sessions can open one too.<\u002Fspan><\u002Fdiv>\n<span style=\"margin-top:12px;font-size:14.5px;line-height:1.5;color:#55524c;text-wrap:pretty\">Later the Session tile joins them, once OpenCode is connected.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<section id=\"B\" data-screen-label=\"B Add OpenCode\" style=\"width:2912px;box-sizing:border-box;padding:80px 80px 0;display:flex;flex-direction:column;gap:24px;background:#ecebe7;color:#1c1b19;font-family:'Geist',system-ui,sans-serif\">\n<div style=\"display:flex;align-items:center;gap:16px\"><span style=\"width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:#1793d1;color:#ffffff;font-size:18px;font-weight:600\">B<\u002Fspan><div style=\"display:flex;flex-direction:column\"><span style=\"font-size:26px;font-weight:600\">Add OpenCode<\u002Fspan><span style=\"font-size:16px;color:#55524c\">Asked for by name. K finds the install, connects, and shows how OpenCode will appear before you keep it.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;align-items:flex-start;gap:20px\">\n<div id=\"B1\" style=\"width:864px;flex:none;display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:flex;align-items:center;gap:10px\"><span style=\"height:24px;display:flex;align-items:center;padding:0 8px;border-radius:7px;background:#1c1b19;color:#ffffff;font:600 12px/1 'Geist Mono',monospace\">B1<\u002Fspan><span style=\"font-size:19px;font-weight:600\">Ask K to add it<\u002Fspan><span style=\"margin-left:auto;height:28px;display:flex;align-items:center;padding:0 11px;border-radius:8px;background:#ffffff;border:1px solid #dad8d3;font:500 13px/1 'Geist Mono',monospace;color:#4a4742;white-space:nowrap\">Super+K add opencode<\u002Fspan><\u002Fdiv>\n<div style=\"width:864px;height:540px;border-radius:12px;overflow:hidden;border:1px solid #d6d4cf;box-shadow:0 22px 50px -28px rgba(0,0,0,.35);pointer-events:none\"><div style=\"width:1440px;height:900px;transform:scale(.6);transform-origin:0 0\"><dc-import name=\"ChatOS Screen v4\" step=\"b1\" framed=\"true\" hint-size=\"1440px,900px\" style=\"width:1440px;height:900px;display:block\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n<span style=\"font-size:15.5px;line-height:1.5;color:#55524c;text-wrap:pretty\">K finds the binary and offers two ways in: start a local server, or connect to one that’s already running. Permissions are set here, and starting sessions only ever happens when you ask.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"width:40px;flex:none;padding-top:300px;display:flex;justify-content:center;color:#a29e96\"><svg width=\"30\" height=\"14\" sc-camel-view-box=\"0 0 30 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M1 7h27M22 1l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<div id=\"B2\" style=\"width:864px;flex:none;display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:flex;align-items:center;gap:10px\"><span style=\"height:24px;display:flex;align-items:center;padding:0 8px;border-radius:7px;background:#1c1b19;color:#ffffff;font:600 12px/1 'Geist Mono',monospace\">B2<\u002Fspan><span style=\"font-size:19px;font-weight:600\">K builds the connector<\u002Fspan><span style=\"margin-left:auto;height:28px;display:flex;align-items:center;padding:0 11px;border-radius:8px;background:#ffffff;border:1px solid #dad8d3;font:500 13px/1 'Geist Mono',monospace;color:#4a4742;white-space:nowrap\">↵<\u002Fspan><\u002Fdiv>\n<div style=\"width:864px;height:540px;border-radius:12px;overflow:hidden;border:1px solid #d6d4cf;box-shadow:0 22px 50px -28px rgba(0,0,0,.35);pointer-events:none\"><div style=\"width:1440px;height:900px;transform:scale(.6);transform-origin:0 0\"><dc-import name=\"ChatOS Screen v4\" step=\"b2\" framed=\"true\" hint-size=\"1440px,900px\" style=\"width:1440px;height:900px;display:block\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n<span style=\"font-size:15.5px;line-height:1.5;color:#55524c;text-wrap:pretty\">OpenCode goes through the same connector interface as any service. K lists its resources, what each opens as, and its actions. Projects get a generated list tile; sessions use the built-in Session tile.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"width:40px;flex:none\"><\u002Fdiv>\n<div style=\"width:864px;flex:none;margin-top:38px;box-sizing:border-box;display:flex;flex-direction:column;gap:4px;padding:26px 28px;border-radius:14px;background:#ffffff;border:1px solid #dedcd7\">\n<span style=\"font-size:20px;font-weight:600\">What the connector holds<\u002Fspan>\n<span style=\"font-size:15px;line-height:1.5;color:#55524c;margin-bottom:12px;text-wrap:pretty\">The same four parts for every source. The OpenCode SDK still handles discovery, auth and streaming underneath.<\u002Fspan>\n<div style=\"display:flex;align-items:flex-start;gap:16px;padding:12px 0;border-top:1px solid #f0efec\"><span style=\"width:180px;flex:none;font-size:15px;font-weight:500\">Auth<\u002Fspan><span style=\"flex:1;font-size:15px;line-height:1.5;color:#55524c;text-wrap:pretty\">Local server, URL, OAuth or token<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:flex-start;gap:16px;padding:12px 0;border-top:1px solid #f0efec\"><span style=\"width:180px;flex:none;font-size:15px;font-weight:500\">Resources<\u002Fspan><span style=\"flex:1;font-size:15px;line-height:1.5;color:#55524c;text-wrap:pretty\">Project, session, changes<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:flex-start;gap:16px;padding:12px 0;border-top:1px solid #f0efec\"><span style=\"width:180px;flex:none;font-size:15px;font-weight:500\">Actions<\u002Fspan><span style=\"flex:1;font-size:15px;line-height:1.5;color:#55524c;text-wrap:pretty\">Per resource, with a default for ↵<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:flex-start;gap:16px;padding:12px 0;border-top:1px solid #f0efec\"><span style=\"width:180px;flex:none;font-size:15px;font-weight:500\">Tile mapping<\u002Fspan><span style=\"flex:1;font-size:15px;line-height:1.5;color:#55524c;text-wrap:pretty\">Generated list / conversation / record / document, or a built-in tile<\u002Fspan><\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<section id=\"C\" data-screen-label=\"C Use OpenCode\" style=\"width:2912px;box-sizing:border-box;padding:80px 80px 0;display:flex;flex-direction:column;gap:24px;background:#ecebe7;color:#1c1b19;font-family:'Geist',system-ui,sans-serif\">\n<div style=\"display:flex;align-items:center;gap:16px\"><span style=\"width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:#1793d1;color:#ffffff;font-size:18px;font-weight:600\">C<\u002Fspan><div style=\"display:flex;flex-direction:column\"><span style=\"font-size:26px;font-weight:600\">Use OpenCode<\u002Fspan><span style=\"font-size:16px;color:#55524c\">Universal search now has more to show. Starting work is an explicit action.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;align-items:flex-start;gap:20px\">\n<div id=\"C1\" style=\"width:864px;flex:none;display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:flex;align-items:center;gap:10px\"><span style=\"height:24px;display:flex;align-items:center;padding:0 8px;border-radius:7px;background:#1c1b19;color:#ffffff;font:600 12px/1 'Geist Mono',monospace\">C1<\u002Fspan><span style=\"font-size:19px;font-weight:600\">Search: chatos, again<\u002Fspan><span style=\"margin-left:auto;height:28px;display:flex;align-items:center;padding:0 11px;border-radius:8px;background:#ffffff;border:1px solid #dad8d3;font:500 13px/1 'Geist Mono',monospace;color:#4a4742;white-space:nowrap\">Super+K chatos<\u002Fspan><\u002Fdiv>\n<div style=\"width:864px;height:540px;border-radius:12px;overflow:hidden;border:1px solid #d6d4cf;box-shadow:0 22px 50px -28px rgba(0,0,0,.35);pointer-events:none\"><div style=\"width:1440px;height:900px;transform:scale(.6);transform-origin:0 0\"><dc-import name=\"ChatOS Screen v4\" step=\"c1\" framed=\"true\" hint-size=\"1440px,900px\" style=\"width:1440px;height:900px;display:block\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n<span style=\"font-size:15.5px;line-height:1.5;color:#55524c;text-wrap:pretty\">Same query, now three different things: the folder (already open, so ↵ goes there), the OpenCode project, and an action to start a session. The project is selected because you opened it last time.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"width:40px;flex:none;padding-top:300px;display:flex;justify-content:center;color:#a29e96\"><svg width=\"30\" height=\"14\" sc-camel-view-box=\"0 0 30 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M1 7h27M22 1l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<div id=\"C2\" style=\"width:864px;flex:none;display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:flex;align-items:center;gap:10px\"><span style=\"height:24px;display:flex;align-items:center;padding:0 8px;border-radius:7px;background:#1c1b19;color:#ffffff;font:600 12px/1 'Geist Mono',monospace\">C2<\u002Fspan><span style=\"font-size:19px;font-weight:600\">An OpenCode project tile<\u002Fspan><span style=\"margin-left:auto;height:28px;display:flex;align-items:center;padding:0 11px;border-radius:8px;background:#ffffff;border:1px solid #dad8d3;font:500 13px/1 'Geist Mono',monospace;color:#4a4742;white-space:nowrap\">↵<\u002Fspan><\u002Fdiv>\n<div style=\"width:864px;height:540px;border-radius:12px;overflow:hidden;border:1px solid #d6d4cf;box-shadow:0 22px 50px -28px rgba(0,0,0,.35);pointer-events:none\"><div style=\"width:1440px;height:900px;transform:scale(.6);transform-origin:0 0\"><dc-import name=\"ChatOS Screen v4\" step=\"c2\" framed=\"true\" hint-size=\"1440px,900px\" style=\"width:1440px;height:900px;display:block\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n<span style=\"font-size:15.5px;line-height:1.5;color:#55524c;text-wrap:pretty\">A generated list: actions at the top, sessions below. Four tiles make a grid.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"width:40px;flex:none;padding-top:300px;display:flex;justify-content:center;color:#a29e96\"><svg width=\"30\" height=\"14\" sc-camel-view-box=\"0 0 30 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M1 7h27M22 1l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<div id=\"C3\" style=\"width:864px;flex:none;display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:flex;align-items:center;gap:10px\"><span style=\"height:24px;display:flex;align-items:center;padding:0 8px;border-radius:7px;background:#1c1b19;color:#ffffff;font:600 12px/1 'Geist Mono',monospace\">C3<\u002Fspan><span style=\"font-size:19px;font-weight:600\">Start a session, explicitly<\u002Fspan><span style=\"margin-left:auto;height:28px;display:flex;align-items:center;padding:0 11px;border-radius:8px;background:#ffffff;border:1px solid #dad8d3;font:500 13px/1 'Geist Mono',monospace;color:#4a4742;white-space:nowrap\">Super+K start an opencode session in chatos: …<\u002Fspan><\u002Fdiv>\n<div style=\"width:864px;height:540px;border-radius:12px;overflow:hidden;border:1px solid #d6d4cf;box-shadow:0 22px 50px -28px rgba(0,0,0,.35);pointer-events:none\"><div style=\"width:1440px;height:900px;transform:scale(.6);transform-origin:0 0\"><dc-import name=\"ChatOS Screen v4\" step=\"c3\" framed=\"true\" hint-size=\"1440px,900px\" style=\"width:1440px;height:900px;display:block\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n<span style=\"font-size:15.5px;line-height:1.5;color:#55524c;text-wrap:pretty\">K parses the sentence into project, agent and first message, and shows them. Nothing runs until ↵.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:flex-start;gap:20px\">\n<div id=\"C4\" style=\"width:864px;flex:none;display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:flex;align-items:center;gap:10px\"><span style=\"height:24px;display:flex;align-items:center;padding:0 8px;border-radius:7px;background:#1c1b19;color:#ffffff;font:600 12px/1 'Geist Mono',monospace\">C4<\u002Fspan><span style=\"font-size:19px;font-weight:600\">The session tile<\u002Fspan><span style=\"margin-left:auto;height:28px;display:flex;align-items:center;padding:0 11px;border-radius:8px;background:#ffffff;border:1px solid #dad8d3;font:500 13px/1 'Geist Mono',monospace;color:#4a4742;white-space:nowrap\">↵<\u002Fspan><\u002Fdiv>\n<div style=\"width:864px;height:540px;border-radius:12px;overflow:hidden;border:1px solid #d6d4cf;box-shadow:0 22px 50px -28px rgba(0,0,0,.35);pointer-events:none\"><div style=\"width:1440px;height:900px;transform:scale(.6);transform-origin:0 0\"><dc-import name=\"ChatOS Screen v4\" step=\"c4\" framed=\"true\" hint-size=\"1440px,900px\" style=\"width:1440px;height:900px;display:block\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n<span style=\"font-size:15.5px;line-height:1.5;color:#55524c;text-wrap:pretty\">The session takes the first slot and starts working. The browser goes to the shelf. The project list marks the session as tiled here.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"width:40px;flex:none;padding-top:300px;display:flex;justify-content:center;color:#a29e96\"><svg width=\"30\" height=\"14\" sc-camel-view-box=\"0 0 30 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M1 7h27M22 1l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<div id=\"C5\" style=\"width:864px;flex:none;display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:flex;align-items:center;gap:10px\"><span style=\"height:24px;display:flex;align-items:center;padding:0 8px;border-radius:7px;background:#1c1b19;color:#ffffff;font:600 12px/1 'Geist Mono',monospace\">C5<\u002Fspan><span style=\"font-size:19px;font-weight:600\">Narrow to OpenCode<\u002Fspan><span style=\"margin-left:auto;height:28px;display:flex;align-items:center;padding:0 11px;border-radius:8px;background:#ffffff;border:1px solid #dad8d3;font:500 13px/1 'Geist Mono',monospace;color:#4a4742;white-space:nowrap\">Super+K, Tab, OpenCode<\u002Fspan><\u002Fdiv>\n<div style=\"width:864px;height:540px;border-radius:12px;overflow:hidden;border:1px solid #d6d4cf;box-shadow:0 22px 50px -28px rgba(0,0,0,.35);pointer-events:none\"><div style=\"width:1440px;height:900px;transform:scale(.6);transform-origin:0 0\"><dc-import name=\"ChatOS Screen v4\" step=\"c5\" framed=\"true\" hint-size=\"1440px,900px\" style=\"width:1440px;height:900px;display:block\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n<span style=\"font-size:15.5px;line-height:1.5;color:#55524c;text-wrap:pretty\">The optional source-first route. K only shows OpenCode projects and sessions; items already open say Go to tile. ⌫ widens back to everything.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<section id=\"D\" data-screen-label=\"D Add Front\" style=\"width:2912px;box-sizing:border-box;padding:80px 80px 0;display:flex;flex-direction:column;gap:24px;background:#ecebe7;color:#1c1b19;font-family:'Geist',system-ui,sans-serif\">\n<div style=\"display:flex;align-items:center;gap:16px\"><span style=\"width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:#1793d1;color:#ffffff;font-size:18px;font-weight:600\">D<\u002Fspan><div style=\"display:flex;flex-direction:column\"><span style=\"font-size:26px;font-weight:600\">Add Front with a token<\u002Fspan><span style=\"font-size:16px;color:#55524c\">The same steps as OpenCode, for a service with no built-in tile at all.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;align-items:flex-start;gap:20px\">\n<div id=\"D1\" style=\"width:864px;flex:none;display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:flex;align-items:center;gap:10px\"><span style=\"height:24px;display:flex;align-items:center;padding:0 8px;border-radius:7px;background:#1c1b19;color:#ffffff;font:600 12px/1 'Geist Mono',monospace\">D1<\u002Fspan><span style=\"font-size:19px;font-weight:600\">Paste a token<\u002Fspan><span style=\"margin-left:auto;height:28px;display:flex;align-items:center;padding:0 11px;border-radius:8px;background:#ffffff;border:1px solid #dad8d3;font:500 13px/1 'Geist Mono',monospace;color:#4a4742;white-space:nowrap\">Super+K add front<\u002Fspan><\u002Fdiv>\n<div style=\"width:864px;height:540px;border-radius:12px;overflow:hidden;border:1px solid #d6d4cf;box-shadow:0 22px 50px -28px rgba(0,0,0,.35);pointer-events:none\"><div style=\"width:1440px;height:900px;transform:scale(.6);transform-origin:0 0\"><dc-import name=\"ChatOS Screen v4\" step=\"d1\" framed=\"true\" hint-size=\"1440px,900px\" style=\"width:1440px;height:900px;display:block\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n<span style=\"font-size:15.5px;line-height:1.5;color:#55524c;text-wrap:pretty\">K knows Front uses API tokens and says where to find one. The token is checked as you paste it and stored in the system keyring.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"width:40px;flex:none;padding-top:300px;display:flex;justify-content:center;color:#a29e96\"><svg width=\"30\" height=\"14\" sc-camel-view-box=\"0 0 30 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M1 7h27M22 1l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<div id=\"D2\" style=\"width:864px;flex:none;display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:flex;align-items:center;gap:10px\"><span style=\"height:24px;display:flex;align-items:center;padding:0 8px;border-radius:7px;background:#1c1b19;color:#ffffff;font:600 12px/1 'Geist Mono',monospace\">D2<\u002Fspan><span style=\"font-size:19px;font-weight:600\">K builds the Front connector<\u002Fspan><span style=\"margin-left:auto;height:28px;display:flex;align-items:center;padding:0 11px;border-radius:8px;background:#ffffff;border:1px solid #dad8d3;font:500 13px/1 'Geist Mono',monospace;color:#4a4742;white-space:nowrap\">↵<\u002Fspan><\u002Fdiv>\n<div style=\"width:864px;height:540px;border-radius:12px;overflow:hidden;border:1px solid #d6d4cf;box-shadow:0 22px 50px -28px rgba(0,0,0,.35);pointer-events:none\"><div style=\"width:1440px;height:900px;transform:scale(.6);transform-origin:0 0\"><dc-import name=\"ChatOS Screen v4\" step=\"d2\" framed=\"true\" hint-size=\"1440px,900px\" style=\"width:1440px;height:900px;display:block\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n<span style=\"font-size:15.5px;line-height:1.5;color:#55524c;text-wrap:pretty\">Every Front resource maps to a generated tile: inboxes as lists, conversations as conversations, contacts as records.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"width:40px;flex:none;padding-top:300px;display:flex;justify-content:center;color:#a29e96\"><svg width=\"30\" height=\"14\" sc-camel-view-box=\"0 0 30 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M1 7h27M22 1l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<div id=\"D3\" style=\"width:864px;flex:none;display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:flex;align-items:center;gap:10px\"><span style=\"height:24px;display:flex;align-items:center;padding:0 8px;border-radius:7px;background:#1c1b19;color:#ffffff;font:600 12px/1 'Geist Mono',monospace\">D3<\u002Fspan><span style=\"font-size:19px;font-weight:600\">Search across sources<\u002Fspan><span style=\"margin-left:auto;height:28px;display:flex;align-items:center;padding:0 11px;border-radius:8px;background:#ffffff;border:1px solid #dad8d3;font:500 13px/1 'Geist Mono',monospace;color:#4a4742;white-space:nowrap\">Super+K furst<\u002Fspan><\u002Fdiv>\n<div style=\"width:864px;height:540px;border-radius:12px;overflow:hidden;border:1px solid #d6d4cf;box-shadow:0 22px 50px -28px rgba(0,0,0,.35);pointer-events:none\"><div style=\"width:1440px;height:900px;transform:scale(.6);transform-origin:0 0\"><dc-import name=\"ChatOS Screen v4\" step=\"d3\" framed=\"true\" hint-size=\"1440px,900px\" style=\"width:1440px;height:900px;display:block\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n<span style=\"font-size:15.5px;line-height:1.5;color:#55524c;text-wrap:pretty\">One query, three sources: a Front conversation, a Front contact, an OpenCode session in another project, and a file. Each says what ↵ does.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:flex-start;gap:20px\">\n<div id=\"D4\" style=\"width:864px;flex:none;display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:flex;align-items:center;gap:10px\"><span style=\"height:24px;display:flex;align-items:center;padding:0 8px;border-radius:7px;background:#1c1b19;color:#ffffff;font:600 12px/1 'Geist Mono',monospace\">D4<\u002Fspan><span style=\"font-size:19px;font-weight:600\">A Front conversation tile<\u002Fspan><span style=\"margin-left:auto;height:28px;display:flex;align-items:center;padding:0 11px;border-radius:8px;background:#ffffff;border:1px solid #dad8d3;font:500 13px/1 'Geist Mono',monospace;color:#4a4742;white-space:nowrap\">↵<\u002Fspan><\u002Fdiv>\n<div style=\"width:864px;height:540px;border-radius:12px;overflow:hidden;border:1px solid #d6d4cf;box-shadow:0 22px 50px -28px rgba(0,0,0,.35);pointer-events:none\"><div style=\"width:1440px;height:900px;transform:scale(.6);transform-origin:0 0\"><dc-import name=\"ChatOS Screen v4\" step=\"d4\" framed=\"true\" hint-size=\"1440px,900px\" style=\"width:1440px;height:900px;display:block\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n<span style=\"font-size:15.5px;line-height:1.5;color:#55524c;text-wrap:pretty\">Customer message, internal comment, reply box and ⌃. to send it to the session beside it. Replying to the customer asks first, as set in D1.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"width:40px;flex:none\"><\u002Fdiv>\n<div style=\"width:864px;flex:none;margin-top:38px;box-sizing:border-box;display:flex;flex-direction:column;gap:4px;padding:26px 28px;border-radius:14px;background:#ffffff;border:1px solid #dedcd7\">\n<span style=\"font-size:20px;font-weight:600\">Any API, same five steps<\u002Fspan>\n<span style=\"font-size:15px;line-height:1.5;color:#55524c;margin-bottom:12px;text-wrap:pretty\">What D1–D4 did for Front works for Gmail, Linear, GitHub or anything with an API.<\u002Fspan>\n<div style=\"display:flex;align-items:flex-start;gap:16px;padding:12px 0;border-top:1px solid #f0efec\"><span style=\"width:180px;flex:none;font-size:15px;font-weight:500\">1. Ask<\u002Fspan><span style=\"flex:1;font-size:15px;line-height:1.5;color:#55524c;text-wrap:pretty\">“add front”<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:flex-start;gap:16px;padding:12px 0;border-top:1px solid #f0efec\"><span style=\"width:180px;flex:none;font-size:15px;font-weight:500\">2. Authenticate<\u002Fspan><span style=\"flex:1;font-size:15px;line-height:1.5;color:#55524c;text-wrap:pretty\">Token, app password or OAuth in a Browser tile<\u002Fspan><\u002Fdiv>\n<
