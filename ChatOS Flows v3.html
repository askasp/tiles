document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

und:#ecebe7;color:#1c1b19;font-family:'Geist',system-ui,sans-serif\">\n<div style=\"display:flex;flex-direction:column;gap:10px;max-width:1300px\">\n<span style=\"font-family:'Geist Mono',monospace;font-size:14px;color:#77736b\">ChatOS · Tile · v3<\u002Fspan>\n<span style=\"font-size:46px;font-weight:600;letter-spacing:-.01em\">Everything is a tile. Super+K opens them.<\u002Fspan>\n<span style=\"font-size:20px;line-height:1.5;color:#55524c;text-wrap:pretty\">No fixed chat column. Projects, sessions, previews, Slack DMs and mail all open as the same kind of box, and the workspace re-tiles itself as you add them. A chat on Super+K finds things, opens them, moves them and clears them away.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px\">\n<div style=\"display:flex;flex-direction:column;gap:8px;padding:20px 22px;border-radius:14px;background:#ffffff;border:1px solid #dedcd7\"><span style=\"font-family:'Geist Mono',monospace;font-size:13px;color:#77736b\">1<\u002Fspan><span style=\"font-size:18px;font-weight:600\">One kind of box<\u002Fspan><span style=\"font-size:15px;line-height:1.5;color:#55524c;text-wrap:pretty\">Same header on every tile: icon, name, where it’s from, type, hide. Only the body differs.<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px;padding:20px 22px;border-radius:14px;background:#ffffff;border:1px solid #dedcd7\"><span style=\"font-family:'Geist Mono',monospace;font-size:13px;color:#77736b\">2<\u002Fspan><span style=\"font-size:18px;font-weight:600\">Tiles size themselves<\u002Fspan><span style=\"font-size:15px;line-height:1.5;color:#55524c;text-wrap:pretty\">1 fills the screen, 2 split, 3 is one big and two stacked, 4 is a grid. A fifth sends the least-used tile to the shelf.<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px;padding:20px 22px;border-radius:14px;background:#ffffff;border:1px solid #dedcd7\"><span style=\"font-family:'Geist Mono',monospace;font-size:13px;color:#77736b\">3<\u002Fspan><span style=\"font-size:18px;font-weight:600\">Super+K runs it<\u002Fspan><span style=\"font-size:15px;line-height:1.5;color:#55524c;text-wrap:pretty\">A chat that opens, moves, hides and closes tiles. Type a name or a sentence. ↵ opens here, ⌃↵ in a new workspace.<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px;padding:20px 22px;border-radius:14px;background:#ffffff;border:1px solid #dedcd7\"><span style=\"font-family:'Geist Mono',monospace;font-size:13px;color:#77736b\">4<\u002Fspan><span style=\"font-size:18px;font-weight:600\">One tile, one place<\u002Fspan><span style=\"font-size:15px;line-height:1.5;color:#55524c;text-wrap:pretty\">Nothing is open twice. Opening something that’s already open takes you to it. ⇧↵ moves it to where you are.<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px;padding:20px 22px;border-radius:14px;background:#ffffff;border:1px solid #dedcd7\"><span style=\"font-family:'Geist Mono',monospace;font-size:13px;color:#77736b\">5<\u002Fspan><span style=\"font-size:18px;font-weight:600\">Linked tiles travel together<\u002Fspan><span style=\"font-size:15px;line-height:1.5;color:#55524c;text-wrap:pretty\">A preview a session opened is linked to it. Move or hide the session and its preview goes along.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"A\" data-screen-label=\"A Open with Super+K\" style=\"width:2912px;box-sizing:border-box;padding:80px 80px 0;display:flex;flex-direction:column;gap:24px;background:#ecebe7;color:#1c1b19;font-family:'Geist',system-ui,sans-serif\">\n<div style=\"display:flex;align-items:center;gap:16px\"><span style=\"width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:#1793d1;color:#ffffff;font-size:18px;font-weight:600\">A<\u002Fspan><div style=\"display:flex;flex-direction:column\"><span style=\"font-size:26px;font-weight:600\">Open a project and a session<\u002Fspan><span style=\"font-size:16px;color:#55524c\">From an empty workspace, one sentence in Super+K.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;align-items:flex-start;gap:20px\">\n<div id=\"A1\" style=\"width:864px;flex:none;display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:flex;align-items:center;gap:10px\"><span style=\"height:24px;display:flex;align-items:center;padding:0 8px;border-radius:7px;background:#1c1b19;color:#ffffff;font:600 12px/1 'Geist Mono',monospace\">A1<\u002Fspan><span style=\"font-size:19px;font-weight:600\">Ask for it<\u002Fspan><span style=\"margin-left:auto;height:28px;display:flex;align-items:center;padding:0 11px;border-radius:8px;background:#ffffff;border:1px solid #dad8d3;font:500 13px/1 'Geist Mono',monospace;color:#4a4742\">Super+K<\u002Fspan><\u002Fdiv>\n<div style=\"width:864px;height:540px;border-radius:12px;overflow:hidden;border:1px solid #d6d4cf;box-shadow:0 22px 50px -28px rgba(0,0,0,.35);pointer-events:none\"><div style=\"width:1440px;height:900px;transform:scale(.6);transform-origin:0 0\"><dc-import name=\"ChatOS Screen v3\" step=\"a1\" framed=\"true\" hint-size=\"1440px,900px\" style=\"width:1440px;height:900px;display:block\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n<span style=\"font-size:15.5px;line-height:1.5;color:#55524c;text-wrap:pretty\">K understands names and sentences. It shows what it will open before it does. One ↵ opens both here.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"width:40px;flex:none;padding-top:300px;display:flex;justify-content:center;color:#a29e96\"><svg width=\"30\" height=\"14\" sc-camel-view-box=\"0 0 30 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M1 7h27M22 1l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<div id=\"A2\" style=\"width:864px;flex:none;display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:flex;align-items:center;gap:10px\"><span style=\"height:24px;display:flex;align-items:center;padding:0 8px;border-radius:7px;background:#1c1b19;color:#ffffff;font:600 12px/1 'Geist Mono',monospace\">A2<\u002Fspan><span style=\"font-size:19px;font-weight:600\">Two tiles<\u002Fspan><span style=\"margin-left:auto;height:28px;display:flex;align-items:center;padding:0 11px;border-radius:8px;background:#ffffff;border:1px solid #dad8d3;font:500 13px/1 'Geist Mono',monospace;color:#4a4742\">↵<\u002Fspan><\u002Fdiv>\n<div style=\"width:864px;height:540px;border-radius:12px;overflow:hidden;border:1px solid #d6d4cf;box-shadow:0 22px 50px -28px rgba(0,0,0,.35);pointer-events:none\"><div style=\"width:1440px;height:900px;transform:scale(.6);transform-origin:0 0\"><dc-import name=\"ChatOS Screen v3\" step=\"a2\" framed=\"true\" hint-size=\"1440px,900px\" style=\"width:1440px;height:900px;display:block\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n<span style=\"font-size:15.5px;line-height:1.5;color:#55524c;text-wrap:pretty\">The project and the session get half each, with the same header. The workspace takes the project’s name.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"width:40px;flex:none;padding-top:300px;display:flex;justify-content:center;color:#a29e96\"><svg width=\"30\" height=\"14\" sc-camel-view-box=\"0 0 30 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M1 7h27M22 1l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<div id=\"A3\" style=\"width:864px;flex:none;display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:flex;align-items:center;gap:10px\"><span style=\"height:24px;display:flex;align-items:center;padding:0 8px;border-radius:7px;background:#1c1b19;color:#ffffff;font:600 12px/1 'Geist Mono',monospace\">A3<\u002Fspan><span style=\"font-size:19px;font-weight:600\">The agent opens a tile<\u002Fspan><span style=\"margin-left:auto;height:28px;display:flex;align-items:center;padding:0 11px;border-radius:8px;background:#ffffff;border:1px solid #dad8d3;font:500 13px/1 'Geist Mono',monospace;color:#4a4742\">nothing, the agent did it<\u002Fspan><\u002Fdiv>\n<div style=\"width:864px;height:540px;border-radius:12px;overflow:hidden;border:1px solid #d6d4cf;box-shadow:0 22px 50px -28px rgba(0,0,0,.35);pointer-events:none\"><div style=\"width:1440px;height:900px;transform:scale(.6);transform-origin:0 0\"><dc-import name=\"ChatOS Screen v3\" step=\"a3\" framed=\"true\" hint-size=\"1440px,900px\" style=\"width:1440px;height:900px;display:block\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n<span style=\"font-size:15.5px;line-height:1.5;color:#55524c;text-wrap:pretty\">The preview is a tile like any other, linked to the session. Three tiles: the session keeps the big slot, the others stack.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"B\" data-screen-label=\"B More tiles\" style=\"width:2912px;box-sizing:border-box;padding:80px 80px 0;display:flex;flex-direction:column;gap:24px;background:#ecebe7;color:#1c1b19;font-family:'Geist',system-ui,sans-serif\">\n<div style=\"display:flex;align-items:center;gap:16px\"><span style=\"width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:#1793d1;color:#ffffff;font-size:18px;font-weight:600\">B<\u002Fspan><div style=\"display:flex;flex-direction:column\"><span style=\"font-size:26px;font-weight:600\">More tiles, smaller tiles<\u002Fspan><span style=\"font-size:16px;color:#55524c\">Slack and Mail open the same way. Past four, the shelf takes over.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;align-items:flex-start;gap:20px\">\n<div id=\"B1\" style=\"width:864px;flex:none;display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:flex;align-items:center;gap:10px\"><span style=\"height:24px;display:flex;align-items:center;padding:0 8px;border-radius:7px;background:#1c1b19;color:#ffffff;font:600 12px/1 'Geist Mono',monospace\">B1<\u002Fspan><span style=\"font-size:19px;font-weight:600\">A Slack DM<\u002Fspan><span style=\"margin-left:auto;height:28px;display:flex;align-items:center;padding:0 11px;border-radius:8px;background:#ffffff;border:1px solid #dad8d3;font:500 13px/1 'Geist Mono',monospace;color:#4a4742\">Super+K dm kari<\u002Fspan><\u002Fdiv>\n<div style=\"width:864px;height:540px;border-radius:12px;overflow:hidden;border:1px solid #d6d4cf;box-shadow:0 22px 50px -28px rgba(0,0,0,.35);pointer-events:none\"><div style=\"width:1440px;height:900px;transform:scale(.6);transform-origin:0 0\"><dc-import name=\"ChatOS Screen v3\" step=\"b1\" framed=\"true\" hint-size=\"1440px,900px\" style=\"width:1440px;height:900px;display:block\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n<span style=\"font-size:15.5px;line-height:1.5;color:#55524c;text-wrap:pretty\">Results come from every source: Slack, Mail, sessions. Drawn from your tokens, in ChatOS’s own design.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"width:40px;flex:none;padding-top:300px;display:flex;justify-content:center;color:#a29e96\"><svg width=\"30\" height=\"14\" sc-camel-view-box=\"0 0 30 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M1 7h27M22 1l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<div id=\"B2\" style=\"width:864px;flex:none;display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:flex;align-items:center;gap:10px\"><span style=\"height:24px;display:flex;align-items:center;padding:0 8px;border-radius:7px;background:#1c1b19;color:#ffffff;font:600 12px/1 'Geist Mono',monospace\">B2<\u002Fspan><span style=\"font-size:19px;font-weight:600\">Four is a grid<\u002Fspan><span style=\"margin-left:auto;height:28px;display:flex;align-items:center;padding:0 11px;border-radius:8px;background:#ffffff;border:1px solid #dad8d3;font:500 13px/1 'Geist Mono',monospace;color:#4a4742\">↵<\u002Fspan><\u002Fdiv>\n<div style=\"width:864px;height:540px;border-radius:12px;overflow:hidden;border:1px solid #d6d4cf;box-shadow:0 22px 50px -28px rgba(0,0,0,.35);pointer-events:none\"><div style=\"width:1440px;height:900px;transform:scale(.6);transform-origin:0 0\"><dc-import name=\"ChatOS Screen v3\" step=\"b2\" framed=\"true\" hint-size=\"1440px,900px\" style=\"width:1440px;height:900px;display:block\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n<span style=\"font-size:15.5px;line-height:1.5;color:#55524c;text-wrap:pretty\">Everything re-tiles to two by two. Super+↵ promotes the focused tile to the big slot when you want it bigger.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"width:40px;flex:none;padding-top:300px;display:flex;justify-content:center;color:#a29e96\"><svg width=\"30\" height=\"14\" sc-camel-view-box=\"0 0 30 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M1 7h27M22 1l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<div id=\"B3\" style=\"width:864px;flex:none;display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:flex;align-items:center;gap:10px\"><span style=\"height:24px;display:flex;align-items:center;padding:0 8px;border-radius:7px;background:#1c1b19;color:#ffffff;font:600 12px/1 'Geist Mono',monospace\">B3<\u002Fspan><span style=\"font-size:19px;font-weight:600\">The fifth goes to the shelf<\u002Fspan><span style=\"margin-left:auto;height:28px;display:flex;align-items:center;padding:0 11px;border-radius:8px;background:#ffffff;border:1px solid #dad8d3;font:500 13px/1 'Geist Mono',monospace;color:#4a4742\">Super+K mail ↵<\u002Fspan><\u002Fdiv>\n<div style=\"width:864px;height:540px;border-radius:12px;overflow:hidden;border:1px solid #d6d4cf;box-shadow:0 22px 50px -28px rgba(0,0,0,.35);pointer-events:none\"><div style=\"width:1440px;height:900px;transform:scale(.6);transform-origin:0 0\"><dc-import name=\"ChatOS Screen v3\" step=\"b3\" framed=\"true\" hint-size=\"1440px,900px\" style=\"width:1440px;height:900px;display:block\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n<span style=\"font-size:15.5px;line-height:1.5;color:#55524c;text-wrap:pretty\">Tiles never get smaller than a quarter. The tile you touched least slides to the shelf in the bar. It keeps running and comes back with a click or Super+K.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"C\" data-screen-label=\"C No bloat\" style=\"width:2912px;box-sizing:border-box;padding:80px 80px 0;display:flex;flex-direction:column;gap:24px;background:#ecebe7;color:#1c1b19;font-family:'Geist',system-ui,sans-serif\">\n<div style=\"display:flex;align-items:center;gap:16px\"><span style=\"width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:#1793d1;color:#ffffff;font-size:18px;font-weight:600\">C<\u002Fspan><div style=\"display:flex;flex-direction:column\"><span style=\"font-size:26px;font-weight:600\">No workspace bloat<\u002Fspan><span style=\"font-size:16px;color:#55524c\">Nothing is open twice, and K can clear the screen for you.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;align-items:flex-start;gap:20px\">\n<div id=\"C1\" style=\"width:864px;flex:none;display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:flex;align-items:center;gap:10px\"><span style=\"height:24px;display:flex;align-items:center;padding:0 8px;border-radius:7px;background:#1c1b19;color:#ffffff;font:600 12px/1 'Geist Mono',monospace\">C1<\u002Fspan><span style=\"font-size:19px;font-weight:600\">Already open? Go there<\u002Fspan><span style=\"margin-left:auto;height:28px;display:flex;align-items:center;padding:0 11px;border-radius:8px;background:#ffffff;border:1px solid #dad8d3;font:500 13px/1 'Geist Mono',monospace;color:#4a4742\">on 2: Super+K kari<\u002Fspan><\u002Fdiv>\n<div style=\"width:864px;height:540px;border-radius:12px;overflow:hidden;border:1px solid #d6d4cf;box-shadow:0 22px 50px -28px rgba(0,0,0,.35);pointer-events:none\"><div style=\"width:1440px;height:900px;transform:scale(.6);transform-origin:0 0\"><dc-import name=\"ChatOS Screen v3\" step=\"c1\" framed=\"true\" hint-size=\"1440px,900px\" style=\"width:1440px;height:900px;display:block\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n<span style=\"font-size:15.5px;line-height:1.5;color:#55524c;text-wrap:pretty\">On another workspace, asking for Kari again doesn’t make a copy. ↵ jumps to workspace 1; ⇧↵ moves the tile here and workspace 1 re-tiles without it.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"width:40px;flex:none;padding-top:300px;display:flex;justify-content:center;color:#a29e96\"><svg width=\"30\" height=\"14\" sc-camel-view-box=\"0 0 30 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M1 7h27M22 1l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<div id=\"C2\" style=\"width:864px;flex:none;display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:flex;align-items:center;gap:10px\"><span style=\"height:24px;display:flex;align-items:center;padding:0 8px;border-radius:7px;background:#1c1b19;color:#ffffff;font:600 12px/1 'Geist Mono',monospace\">C2<\u002Fspan><span style=\"font-size:19px;font-weight:600\">Let K tidy up<\u002Fspan><span style=\"margin-left:auto;height:28px;display:flex;align-items:center;padding:0 11px;border-radius:8px;background:#ffffff;border:1px solid #dad8d3;font:500 13px/1 'Geist Mono',monospace;color:#4a4742\">“just the consent fix”<\u002Fspan><\u002Fdiv>\n<div style=\"width:864px;height:540px;border-radius:12px;overflow:hidden;border:1px solid #d6d4cf;box-shadow:0 22px 50px -28px rgba(0,0,0,.35);pointer-events:none\"><div style=\"width:1440px;height:900px;transform:scale(.6);transform-origin:0 0\"><dc-import name=\"ChatOS Screen v3\" step=\"c2\" framed=\"true\" hint-size=\"1440px,900px\" style=\"width:1440px;height:900px;display:block\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n<span style=\"font-size:15.5px;line-height:1.5;color:#55524c;text-wrap:pretty\">K can arrange too: keep the session and its linked preview, shelve the rest. It says what it did, and ⌃Z undoes it.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"width:40px;flex:none\"><\u002Fdiv>\n<div style=\"width:864px;flex:none;margin-top:38px;display:flex;flex-direction:column;gap:4px;padding:26px 28px;border-radius:14px;background:#ffffff;border:1px solid #dedcd7\">\n<span style=\"font-size:20px;font-weight:600\">One workspace, or several?<\u002Fspan>\n<span style=\"font-size:15px;line-height:1.5;color:#55524c;margin-bottom:12px;text-wrap:pretty\">The three options for your bloat worry, and the one these screens use.<\u002Fspan>\n<div style=\"display:flex;flex-direction:column;gap:4px;padding:14px 0;border-top:1px solid #f0efec\"><span style=\"font-size:16px;font-weight:600\">One workspace + shelf<\u002Fspan><span style=\"font-size:15px;line-height:1.5;color:#55524c;text-wrap:pretty\">No bloat at all. But two projects share one screen, and every switch means shelving and unshelving several tiles.<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:4px;padding:14px 0;border-top:1px solid #f0efec\"><span style=\"font-size:16px;font-weight:600\">Workspaces, duplicates allowed<\u002Fspan><span style=\"font-size:15px;line-height:1.5;color:#55524c;text-wrap:pretty\">Most flexible, and exactly the bloat you’re worried about: Kari open in three places, none of them current.<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px;padding:14px 16px;margin-top:4px;border-radius:12px;background:#f2f8fc;border:1px solid #d6e6f1\"><span style=\"font-size:16px;font-weight:600;color:#1478b0\">Proposed: workspaces, no duplicates<\u002Fspan><span style=\"font-size:15px;line-height:1.5;color:#3d4a52;text-wrap:pretty\">Open here is the default; a new workspace only when you ask (⌃↵). Each tile lives in exactly one place, so asking again takes you to it. Max four visible, the rest on the shelf. Empty workspaces disappear, like in i3.<\u002Fspan><\u002Fdiv>\n<span style=\"margin-top:12px;font-size:14.5px;line-height:1.5;color:#55524c;text-wrap:pretty\">In practice: one workspace per thing you’re working on, usually one per project. If you never press ⌃↵, it works like the single-workspace option.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"D\" data-screen-label=\"D Overview and keys\" style=\"width:2912px;box-sizing:border-box;padding:80px 80px 110px;display:flex;flex-direction:column;gap:24px;background:#ecebe7;color:#1c1b19;font-family:'Geist',system-ui,sans-serif\">\n<div style=\"display:flex;align-items:center;gap:16px\"><span style=\"width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:#1793d1;color:#ffffff;font-size:18px;font-weight:600\">D<\u002Fspan><div style=\"display:flex;flex-direction:column\"><span style=\"font-size:26px;font-weight:600\">Overview and keys<\u002Fspan><span style=\"font-size:16px;color:#55524c\">Super arranges tiles. Super+K does anything by name. Inside a tile, keys type.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;align-items:flex-start;gap:20px\">\n<div id=\"D1\" style=\"width:864px;flex:none;display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:flex;align-items:center;gap:10px\"><span style=\"height:24px;display:flex;align-items:center;padding:0 8px;border-radius:7px;background:#1c1b19;color:#ffffff;font:600 12px/1 'Geist Mono',monospace\">D1<\u002Fspan><span style=\"font-size:19px;font-weight:600\">Overview<\u002Fspan><span style=\"margin-left:auto;height:28px;display:flex;align-items:center;padding:0 11px;border-radius:8px;background:#ffffff;border:1px solid #dad8d3;font:500 13px/1 'Geist Mono',monospace;color:#4a4742\">Super+Tab<\u002Fspan><\u002Fdiv>\n<div style=\"width:864px;height:540px;border-radius:12px;overflow:hidden;border:1px solid #d6d4cf;box-shadow:0 22px 50px -28px rgba(0,0,0,.35);pointer-events:none\"><div style=\"width:1440px;height:900px;transform:scale(.6);transform-origin:0 0\"><dc-import name=\"ChatOS Screen v3\" step=\"d1\" framed=\"true\" hint-size=\"1440px,900px\" style=\"width:1440px;height:900px;display:block\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n<span style=\"font-size:15.5px;line-height:1.5;color:#55524c;text-wrap:pretty\">Workspaces and the shelf side by side. Drag a shelved tile onto a workspace to bring it back there.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"width:40px;flex:none\"><\u002Fdiv>\n<div style=\"width:864px;flex:none;margin-top:38px;display:flex;flex-direction:column;gap:2px;padding:24px 26px;border-radius:14px;background:#ffffff;border:1px solid #dedcd7\">\n<span style=\"font-size:20px;font-weight:600\">Super+K<\u002Fspan>\n<span style=\"font-size:15px;color:#55524c;margin-bottom:12px\">Open, move and tidy by name or by sentence.<\u002Fspan>\n<div style=\"display:flex;align-items:center;gap:14px;padding:9px 0;border-top:1px solid #f0efec\"><span style=\"width:240px;flex:none;font-family:'Geist Mono',monospace;font-size:14px\">Super+K<\u002Fspan><span style=\"flex:1;font-size:15px;color:#55524c\">Ask or open. Also Super+Space.<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:14px;padding:9px 0;border-top:1px solid #f0efec\"><span style=\"width:240px;flex:none;font-family:'Geist Mono',monospace;font-size:14px\">  ↵<\u002Fspan><span style=\"flex:1;font-size:15px;color:#55524c\">Open here. If it’s already open, go to it.<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:14px;padding:9px 0;border-top:1px solid #f0efec\"><span style=\"width:240px;flex:none;font-family:'Geist Mono',monospace;font-size:14px\">  ⌃↵<\u002Fspan><span style=\"flex:1;font-size:15px;color:#55524c\">Open in a new workspace<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:14px;padding:9px 0;border-top:1px solid #f0efec\"><span style=\"width:240px;flex:none;font-family:'Geist Mono',monospace;font-size:14px\">  ⇧↵<\u002Fspan><span style=\"flex:1;font-size:15px;color:#55524c\">Move it here from wherever it is<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:14px;padding:9px 0;border-top:1px solid #f0efec\"><span style=\"width:240px;flex:none;font-family:'Geist Mono',monospace;font-size:14px\">  Tab<\u002Fspan><span style=\"flex:1;font-size:15px;color:#55524c\">Switch from search to chat with the agent behind K<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:14px;padding:9px 0;border-top:1px solid #f0efec\"><span style=\"width:240px;flex:none;font-family:'Geist Mono',monospace;font-size:14px\">  ⌃Z<\u002Fspan><span style=\"flex:1;font-size:15px;color:#55524c\">Undo the last thing K arranged<\u002Fspan><\u002Fdiv>\n<span style=\"margin-top:12px;font-size:14.5px;line-height:1.5;color:#55524c;text-wrap:pretty\">Things K understands: “open amino”, “dm kari”, “mail from furst”, “put slack next to the session”, “hide everything but the preview”, “close what I haven’t used today”.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:16px;max-width:1748px\">\n<div style=\"display:flex;flex-direction:column;gap:2px;padding:24px 26px;border-radius:14px;background:#ffffff;border:1px solid #dedcd7\">\n<span style=\"font-size:20px;font-weight:600\">Super · tiles and workspaces<\u002Fspan>\n<span style=\"font-size:15px;color:#55524c;margin-bottom:12px\">Same everywhere. Tagged keys mean what they mean in i3.<\u002Fspan>\n<div style=\"display:flex;align-items:center;gap:14px;padding:9px 0;border-top:1px solid #f0efec\"><span style=\"width:240px;flex:none;font-family:'Geist Mono',monospace;font-size:14px\">Super+1…9<\u002Fspan><span style=\"flex:1;font-size:15px;color:#55524c\">Go to workspace<\u002Fspan><span style=\"font:500 11px/1 'Geist Mono',monospace;padding:3px 6px;border-radius:5px;border:1px solid #dad8d3;color:#77736b\">i3<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:14px;padding:9px 0;border-top:1px solid #f0efec\"><span style=\"width:240px;flex:none;font-family:'Geist Mono',monospace;font-size:14px\">Super+arrows  or HJKL<\u002Fspan><span style=\"flex:1;font-size:15px;color:#55524c\">Focus the tile in that direction<\u002Fspan><span style=\"font:500 11px/1 'Geist Mono',monospace;padding:3px 6px;border-radius:5px;border:1px solid #dad8d3;color:#77736b\">i3<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:14px;padding:9px 0;border-top:1px solid #f0efec\"><span style=\"width:240px;flex:none;font-family:'Geist Mono',monospace;font-size:14px\">Super+Shift+arrows<\u002Fspan><span style=\"flex:1;font-size:15px;color:#55524c\">Swap the tile with its neighbour<\u002Fspan><span style=\"font:500 11px/1 'Geist Mono',monospace;padding:3px 6px;border-radius:5px;border:1px solid #dad8d3;color:#77736b\">i3<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:14px;padding:9px 0;border-top:1px solid #f0efec\"><span style=\"width:240px;flex:none;font-family:'Geist Mono',monospace;font-size:14px\">Super+↵<\u002Fspan><span style=\"flex:1;font-size:15px;color:#55524c\">Promote the focused tile to the big slot<\u002Fspan><span style=\"font:500 11px/1 'Geist Mono',monospace;padding:3px 6px;border-radius:5px;border:1px solid #dad8d3;color:#77736b\">dwm<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:14px;padding:9px 0;border-top:1px solid #f0efec\"><span style=\"width:240px;flex:none;font-family:'Geist Mono',monospace;font-size:14px\">Super+F<\u002Fspan><span style=\"flex:1;font-size:15px;color:#55524c\">Fullscreen the tile, again to return<\u002Fspan><span style=\"font:500 11px/1 'Geist Mono',monospace;padding:3px 6px;border-radius:5px;border:1px solid #dad8d3;color:#77736b\">i3<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:14px;padding:9px 0;border-top:1px solid #f0efec\"><span style=\"width:240px;flex:none;font-family:'Geist Mono',monospace;font-size:14px\">Super+Shift+1…9<\u002Fspan><span style=\"flex:1;font-size:15px;color:#55524c\">Move the tile (and its linked tiles) to that workspace<\u002Fspan><span style=\"font:500 11px/1 'Geist Mono',monospace;padding:3px 6px;border-radius:5px;border:1px solid #dad8d3;color:#77736b\">i3<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:14px;padding:9px 0;border-top:1px solid #f0efec\"><span style=\"width:240px;flex:none;font-family:'Geist Mono',monospace;font-size:14px\">Super+Tab<\u002Fspan><span style=\"flex:1;font-size:15px;color:#55524c\">Overview: workspaces and shelf<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:2px;padding:24px 26px;border-radius:14px;background:#ffffff;border:1px solid #dedcd7\">\n<span style=\"font-size:20px;font-weight:600\">Shelf and closing<\u002Fspan>\n<span style=\"font-size:15px;color:#55524c;margin-bottom:12px\">Hiding is the normal way to get something out of the way.<\u002Fspan>\n<div style=\"display:flex;align-items:center;gap:14px;padding:9px 0;border-top:1px solid #f0efec\"><span style=\"width:240px;flex:none;font-family:'Geist Mono',monospace;font-size:14px\">Super+-<\u002Fspan><span style=\"flex:1;font-size:15px;color:#55524c\">Send the focused tile to the shelf<\u002Fspan><span style=\"font:500 11px/1 'Geist Mono',monospace;padding:3px 6px;border-radius:5px;border:1px solid #dad8d3;color:#77736b\">i3 scratchpad<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:14px;padding:9px 0;border-top:1px solid #f0efec\"><span style=\"width:240px;flex:none;font-family:'Geist Mono',monospace;font-size:14px\">Super+=<\u002Fspan><span style=\"flex:1;font-size:15px;color:#55524c\">Bring back the last shelved tile<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:14px;padding:9px 0;border-top:1px solid #f0efec\"><span style=\"width:240px;flex:none;font-family:'Geist Mono',monospace;font-size:14px\">Super+Shift+Q<\u002Fspan><span style=\"flex:1;font-size:15px;color:#55524c\">Close the tile. Sessions keep running on the server.<\u002Fspan><span style=\"font:500 11px/1 'Geist Mono',monospace;padding:3px 6px;border-radius:5px;border:1px solid #dad8d3;color:#77736b\">i3<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:14px;padding:9px 0;border-top:1px solid #f0efec\"><span style=\"width:240px;flex:none;font-family:'Geist Mono',monospace;font-size:14px\">Super+U<\u002Fspan><span style=\"flex:1;font-size:15px;color:#55524c\">Go to whatever is waiting on you, shelved or not<\u002Fspan><\u002Fdiv>\n<span style=\"padding:16px 0 4px;font-size:13px;color:#77736b\">Inside a tile<\u002Fspan>\n<div style=\"display:flex;align-items:center;gap:14px;padding:9px 0;border-top:1px solid #f0efec\"><span style=\"width:240px;flex:none;font-family:'Geist Mono',monospace;font-size:14px\">⌃.<\u002Fspan><span style=\"flex:1;font-size:15px;color:#55524c\">Send what’s selected (email, message, element) to a session<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:14px;padding:9px 0;border-top:1px solid #f0efec\"><span style=\"width:240px;flex:none;font-family:'Geist Mono',monospace;font-size:14px\">J / K  ·  R  ·  E<\u002Fspan><span style=\"flex:1;font-size:15px;color:#55524c\">Lists: move · reply · archive<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:14px;padding:9px 0;border-top:1px solid #f0efec\"><span style=\"width:240px;flex:none;font-family:'Geist Mono',monospace;font-size:14px\">↵  ·  ⌥↵  ·  Esc<\u002Fspan><span style=\"flex:1;font-size:15px;color:#55524c\">Session composer: send · queue · interrupt<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
